  <style>
    :root {
      --burgundy-deep: #4a0011;
      --burgundy: #7a0c2e;
      --rose-gold: #b76e79;
      --rose-gold-light: #e8c5ce;
      --gold: #d4af37;
      --gold-light: #f9e8a2;
      --text-dark: #2b2b2b;
      --text-muted: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at center, #2e030e 0%, #0a0104 100%);
      color: var(--text-dark);
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Canvas de Partículas */
    #fx-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* PANTALLA DEL SOBRE ROSE GOLD */
    .envelope-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #2e030e 0%, #0a0104 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s cubic-bezier(0.77, 0, 0.175, 1), visibility 1.2s;
    }

    .envelope-screen.opened {
      opacity: 0;
      visibility: hidden;
    }
